name: Sync Analytics Data
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish data.json
        env:
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import json, base64, urllib.request, urllib.error, hashlib, os

          token = os.environ['ANALYTICS_TOKEN']
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'analytics-sync/1.0',
              'Content-Type': 'application/json',
          }

          def gh_get(repo, path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{path}',
                  headers=headers
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Read all month files from site-analytics
          files = gh_get('EdrilanBerisha/site-analytics', 'visits')
          month_files = sorted(
              [f for f in files if f['type'] == 'file' and f['name'].endswith('.json')],
              key=lambda f: f['name']
          )

          all_events = []
          for mf in month_files:
              d = gh_get('EdrilanBerisha/site-analytics', f'visits/{mf["name"]}')
              events = json.loads(base64.b64decode(d['content'].replace('\n', '')).decode())
              for e in events:
                  if 'ip' in e:
                      e['ip'] = hashlib.sha256(e['ip'].encode()).hexdigest()[:16]
              all_events.extend(events)

          all_events.sort(key=lambda e: e.get('ts', ''))
          new_content = json.dumps(all_events, separators=(',', ':'))
          print(f'Total events: {len(all_events)}')

          # Get current data.json SHA (needed for update; None if file doesn't exist yet)
          file_sha = None
          try:
              current = gh_get('EdrilanBerisha/edrilanberisha.github.io', 'analytics/data.json')
              file_sha = current['sha']
              existing = base64.b64decode(current['content'].replace('\n', '')).decode()
              if existing == new_content:
                  print('No changes — skipping commit')
                  exit(0)
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          # Commit via Contents API — creates a real commit, triggers Pages deploy
          body = {
              'message': 'chore: sync analytics data',
              'content': base64.b64encode(new_content.encode()).decode(),
          }
          if file_sha:
              body['sha'] = file_sha

          req = urllib.request.Request(
              'https://api.github.com/repos/EdrilanBerisha/edrilanberisha.github.io/contents/analytics/data.json',
              data=json.dumps(body).encode(),
              headers=headers,
              method='PUT'
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
          print(f'Committed: {result["commit"]["sha"][:12]}')
          PYEOF
